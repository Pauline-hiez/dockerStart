services:

  db:
    image: mysql:8
    restart: always
    container_name: mysql_db

    environment:
      MYSQL_ROOT_PASSWORD: motdepasse
      MYSQL_DATABASE: lamp_demo
      MYSQL_USER: dev
      MYSQL_PASSWORD: devmdp

    volumes:
      - db_data:/var/lib/mysql

  php:
    build: .
    restart: always
    image: php:8.2-apache
    container_name: php_app
    ports:
      - "8081:80"
    volumes:
      - ./src:/var/www/html
    depends_on:
      - db

  phpmyadmin:
    image: phpmyadmin
    restart: always
    ports: 
      - "8081:80"

    environment:
      PMA_HOST: db
      MYSQL_ROOT: motdepasse

volumes:
  db_data:
    
      