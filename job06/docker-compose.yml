services:
  database: 
    image: mysql:8.0
    container_name: database
    
    environment:
      MYSQL_ROOT_PASSWORD: motdepasse
      MYSQL_DATABASE: appdb
      MYSQL_USER: dev
      MYSQL_PASSWORD: motdepasse 

    ports:
      - "3306:3306"

    volumes:
      - db_data:/var/lib/mysql
    networks:
      - app-network 

  backend:
    image: node:18
    container_name: backend 
    working_dir: /app 
    volumes:
      - ./backend:/app
    ports: 
      - "3000:3000"
    depends_on:
      - database 
    environment:
      DB_HOST: root 
      DB_USER: user 
      DB_PASSWORD: password 
      DB_NAME: appdb 
    networks:
      - app-network 

  nginx:
    image: nginx:alpine
    container_name: nginx 
    ports: 
      - "8088:88"
    volumes: 
      - ./frontend/usr/share/nginx/html:ro
    depends_on:
      - backend 
    networks:
      - app-network

  adminer:
    image: adminer 
    container_name: adminer 
    ports: 
      - "8089:89"
    depends_on:
      - database 
    networks:
      - app-network 

volumes:
  db_data:

networks:
  app-network:
    driver: bridge