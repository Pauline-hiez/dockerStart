services:
  database: 
    image: mysql:8.0
    container_name: database
    
    environment:
      MYSQL_ROOT_PASSWORD: motdepasse
      MYSQL_DATABASE: projetdb
      MYSQL_USER: root
      MYSQL_PASSWORD: rootpassword 

    volumes:
      - db_data:/var/lib/mysql
    networks:
      - app-network 
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-pmotdepasse"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    image: node:18
    container_name: backend 
    working_dir: /app 
    volumes:
      - ./backend:/app
    command: sh -c "npm install && npm start"
    ports: 
      - "3000:3000"
    depends_on:
      database:
        condition: service_healthy
    environment:
      DB_HOST: database 
      DB_USER: dev 
      DB_PASSWORD: motdepasse 
      DB_NAME: appdb 
    networks:
      - app-network 

  nginx:
    image: nginx:alpine
    container_name: nginx 
    ports: 
      - "8088:80"
    volumes: 
      - ./frontend:/usr/share/nginx/html:ro
    depends_on:
      backend:
        condition: service_started
    networks:
      - app-network

  adminer:
    image: adminer 
    container_name: adminer 
    ports: 
      - "8089:8080"
    depends_on:
      database:
        condition: service_healthy
    networks:
      - app-network 

volumes:
  db_data:

networks:
  app-network:
    driver: bridge